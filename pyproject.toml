[project]
name = "steely"
dynamic = ["version"]
description = "A Python developer toolkit with beautiful terminal output: debugging decorators (logging, timing, variable tracking), a thread-safe Logger with Grafana/Loki shipping, provider-agnostic email (SMTP/Resend/HTTP), streaming speech-to-text (Deepgram, AssemblyAI, Google, Azure, AWS, WhisperLive), and FastAPI request recorders."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Tom Neto"}
]
keywords = [
    "debugging",
    "logging",
    "profiling",
    "tracing",
    "decorator",
    "variable-tracking",
    "execution-time",
    "terminal",
    "colored-output",
    "developer-tools",
    "debug",
    "trace",
    "inspect",
    "monitor",
    "logging",
    "grafana",
    "loki",
    "email",
    "smtp",
    "resend",
    "speech-to-text",
    "stt",
    "transcription",
    "fastapi"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Logging",
    "Typing :: Typed",
    "Environment :: Console"
]
dependencies = []

[project.optional-dependencies]
# FastAPI request recorders (steely.fastapi.recorder). The core package never
# imports fastapi, so `import steely` is safe without this extra.
#   pip install "steely[fastapi]"
fastapi = ["fastapi>=0.100"]

# HTTP email providers (Resend, generic HTTPAPIProvider) need httpx.
# SMTP works with the standard library alone and needs no extra.
#   pip install "steely[http]"
http = ["httpx>=0.27"]

# --- streaming STT backends (each optional; install only what you use) ---
# The core steely.stt (interface, session, factory) needs NOTHING new — it runs
# on stdlib asyncio. Each provider pulls its own official SDK, lazily, so
# `import steely.stt` is always safe with none of these installed.
stt-deepgram = ["deepgram-sdk>=3.0"]
stt-assemblyai = ["assemblyai>=0.30"]
stt-google = ["google-cloud-speech>=2.26"]
stt-azure = ["azure-cognitiveservices-speech>=1.40"]
stt-aws = ["amazon-transcribe>=0.6"]
# WhisperLive is self-hosted (faster-whisper) over a raw WebSocket; endpointing
# is handled by the server VAD + the adapter, so only a WS client is needed.
stt-whisperlive = ["websockets>=12"]
# Audio resampling uses stdlib `audioop` on Python <=3.12; 3.13+ needs the back-port:
audio = ["audioop-lts; python_version >= '3.13'"]
# Convenience aggregates:
stt-all = [
    "deepgram-sdk>=3.0",
    "assemblyai>=0.30",
    "google-cloud-speech>=2.26",
    "azure-cognitiveservices-speech>=1.40",
    "amazon-transcribe>=0.6",
    "websockets>=12",
    "audioop-lts; python_version >= '3.13'",
]
all = [
    "fastapi>=0.100",
    "deepgram-sdk>=3.0",
    "assemblyai>=0.30",
    "google-cloud-speech>=2.26",
    "azure-cognitiveservices-speech>=1.40",
    "amazon-transcribe>=0.6",
    "websockets>=12",
    "audioop-lts; python_version >= '3.13'",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/tomneto/steely"
Documentation = "https://github.com/tomneto/steely#readme"
Repository = "https://github.com/tomneto/steely"
Issues = "https://github.com/tomneto/steely/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "httpx>=0.27",
    "websockets>=12",
    "fastapi>=0.100",
    "twine>=6.2.0",
    "audioop-lts; python_version >= '3.13'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steely"]

[tool.hatch.version]
path = "steely/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # contextlib.suppress is ~2x the call overhead of try/except-pass and this
    # library rewrites hot paths for exactly that kind of margin (see Logger.log).
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# Runnable demos: long curl one-liners in docstrings, and deliberately "useless"
# expressions/unused locals that exist to be observed by the decorators.
"examples/*" = ["E501", "B018", "F841"]
# The scan()/log() demo at the bottom of the package assigns locals purely so the
# tracker has something to report.
"steely/__init__.py" = ["F841"]
# Tests intentionally construct odd shapes: unused locals under tracing
# decorators, broad pytest.raises, imports after sys.path/monkeypatch setup.
"test/*" = ["F841", "B017", "E402"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
